name: Platform CI

on:
  push:
    branches:
      [feature/modulo-02-google-auth, feature/modulo-03-database-foundation]
  pull_request:
    branches: [main, feature/modulo-02-google-auth]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AUTH_SECRET: ci-secret-with-at-least-32-characters
      AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve critical dependencies
        run: npm ls @auth/prisma-adapter@2.11.1 @vitest/coverage-v8@2.1.9
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Deploy migrations
        run: npx prisma migrate deploy
      - name: Check migration status
        run: npx prisma migrate status
      - name: Apply idempotent technical seed
        run: npm run db:seed
      - name: Validate authentication database
        run: npm run db:validate-auth
      - name: Validate domain database foundation
        run: npm run db:validate-foundation
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test
      - name: Coverage
        run: npm run test:coverage
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Diff check
        run: git diff --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public authentication E2E
        run: npm run test:e2e
