name: Assisted Google OAuth homologation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assisted-auth:
    runs-on: ubuntu-latest
    environment: auth-homologation
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
      AUTH_URL: ${{ secrets.TEST_AUTH_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require homologation secrets without printing values
        shell: bash
        run: |
          required=(DATABASE_URL AUTH_SECRET AUTH_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET)
          for variable in "${required[@]}"; do
            test -n "${!variable}" || { echo "Missing required secret: ${variable}"; exit 1; }
          done
      - name: Install dependencies
        run: npm ci
      - name: Generate and migrate test database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate status
          npm run db:validate-auth
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run non-interactive authentication checks
        run: npm run test:e2e
      - name: Publish assisted homologation guidance
        run: |
          {
            echo '## Google OAuth assisted homologation'
            echo 'Automated username/password entry is intentionally not performed.'
            echo 'No Google account password is requested or stored by this workflow.'
            echo 'A reviewer must validate consent, callback, MFA/CAPTCHA, first access, Account persistence, role assignment, logout and blocked statuses using the protected test environment.'
          } >> "$GITHUB_STEP_SUMMARY"
